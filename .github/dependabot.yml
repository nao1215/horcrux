# Version updates arrive once a month, one pull request per ecosystem.
# Each group applies to version updates only. Security updates are switched on
# in the repository settings, not here; where they are on, Dependabot opens
# them as advisories appear, outside this schedule and these groups.
version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
      - 'automated'
    assignees:
      - 'nao1215'
    reviewers:
      - 'nao1215'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    assignees:
      - 'nao1215'
    reviewers:
      - 'nao1215'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
